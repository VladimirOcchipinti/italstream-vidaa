name: Update Italian TV EPG Guide

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build compact Italian EPG JSON
        run: node scripts/build_epg_it.js
      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg-it-compact.json
          git diff --staged --quiet || (git commit -m "chore(epg): refresh Italian EPG guide" && git push)
